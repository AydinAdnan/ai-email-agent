[project]
name = "email-autonomy-agent"
version = "0.1.0"
description = "Email autonomy agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0,<2.0",
    "langchain-openai",
    "presidio-analyzer",
    "presidio-anonymizer",
    "deepeval",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
