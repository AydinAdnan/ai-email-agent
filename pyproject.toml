[project]
name = "email-autonomy-agent"
version = "0.1.0"
description = "Email autonomy agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0,<2.0",
    "langchain-openai",
    "presidio-analyzer",
    "presidio-anonymizer",
    "deepeval",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0",
    "en-core-web-lg==3.8.0",
]

[tool.uv.sources]
# spaCy models are published as wheels on GitHub releases, not on PyPI.
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }

[project.scripts]
# The package installs as `agent` (hatchling builds src/agent), so every module
# imports `agent.*` and this entry point resolves the same copy the tests import.
wajo = "agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The eval tooling is a package beside the source tree rather than inside it, and the
# `wajo eval` command imports it, so the console script needs it installed too.
packages = ["src/agent", "evals"]

[tool.pytest.ini_options]
# `agent` lives under src/, and the editable install is not guaranteed in every
# context (CI installs it, a bare `pytest` may not).
# `evals/` is a package at the repository root, not under src/, so the root goes on the
# path too: the scorer's tests import the same module the eval command runs.
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "SIM", "S", "RUF"]
# E501: long lines are allowed where a regex or message reads better on one line.
# RUF001-003: prose and the name-cleaning regex use typographic dashes on purpose.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
