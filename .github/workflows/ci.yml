name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies (spaCy model pinned in uv.lock)
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check src tests

      - name: Tests
        run: uv run pytest -q
